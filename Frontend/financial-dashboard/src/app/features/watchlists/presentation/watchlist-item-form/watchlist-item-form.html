<form [formGroup]="form" (ngSubmit)="submit()">
  <h2>{{ item() ? 'Editar seguimiento' : 'Agregar un activo' }}</h2>
  <p class="muted">Elige un activo y añade una nota para tu próxima revisión.</p>
  <label for="watch-coin">Activo</label
  ><select id="watch-coin" formControlName="coinId" required>
    @for (asset of assets; track asset.id) {
      <option [value]="asset.id">{{ asset.name }} · {{ asset.symbol }}</option>
    }</select
  ><label for="watch-note">Nota <span class="muted">(opcional)</span></label
  ><textarea
    id="watch-note"
    formControlName="note"
    maxlength="240"
    rows="3"
    placeholder="¿Qué quieres observar?"
  ></textarea
  ><small class="muted">{{ form.controls.note.value.length }} / 240 caracteres</small>
  <div class="form-actions">
    <button class="primary" type="submit" [disabled]="busy() || form.invalid">
      {{ busy() ? 'Guardando…' : item() ? 'Guardar cambios' : 'Agregar a mi lista' }}
    </button>
    @if (item()) {
      <button class="secondary" type="button" (click)="cancel.emit()" [disabled]="busy()">
        Cancelar
      </button>
    }
  </div>
</form>
